services:
services:
  - type: web
    name: ai-detector
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python scripts/preload_model.py
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: INVITE_CODE
        value: PM-2025        # <— change if you want
      - key: RATE_LIMIT_TOTAL
        value: "10"
      - key: MAX_WORDS
        value: "1500"
      - key: ARTIFACTS_DIR
        value: ./exp_v4
      - key: LOCAL_MODEL_DIR
        value: ./.models/minilm
      - key: TRANSFORMERS_CACHE
        value: ./.cache/hf
      - key: HF_HOME
        value: ./.cache/hf
